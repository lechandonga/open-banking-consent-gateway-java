server.port=8080
spring.application.name=open-banking-consent-gateway

# 每客户每个固定窗口允许的请求数
gateway.quota.limit=10
# 配额窗口长度（毫秒）
gateway.quota.window-ms=60000

# 回调投递最大尝试次数（含首次）
gateway.callback.max-attempts=5
# 首次重试退避基数（毫秒），第 n 次重试等待 base * 2^(n-1)
gateway.callback.backoff-base-ms=200
# 退避上限（毫秒）
gateway.callback.backoff-max-ms=5000
# 回调签名 HMAC 密钥（演示用，生产环境须通过密钥管理注入）
gateway.callback.signing-secret=local-demo-signing-secret
# 回调目标地址（本地内置接收方），可在测试中覆盖
gateway.callback.target-url=http://localhost:${server.port}/internal/receiver
# 时间戳超过该秒数视为重放
gateway.callback.max-timestamp-skew-seconds=300
# 异步投递工作线程数
gateway.callback.worker-threads=2
