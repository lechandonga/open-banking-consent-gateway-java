server.port=8080
spring.application.name=open-banking-consent-gateway

# 单客户每分钟配额（固定窗口）
gateway.quota.limit-per-minute=10
# 授权默认有效期（秒）
gateway.consent.default-ttl-seconds=3600

# 回调投递：最大尝试次数（含首次）与退避基数（毫秒），第 n 次重试延迟 = base * 2^(n-1)
gateway.callback.max-attempts=4
gateway.callback.backoff-base-millis=50
gateway.callback.signing-secret=local-test-secret
# 默认回调接收方为应用内置的验签回显端点，本地启动即可观察投递成功
gateway.callback.receiver-url=http://localhost:8080/callbacks/receiver
# 时间戳与 nonce 重放保护参数（秒 / 每个接收方保留 nonce 数）
gateway.callback.timestamp-tolerance-seconds=300
gateway.callback.nonce-cache-size=1024
